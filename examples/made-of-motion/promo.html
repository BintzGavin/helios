<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light Over Time</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #060b18; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="film" width="1440" height="1080"></canvas>
<script type="module">
  // "Light Over Time", a Helios promo (see src/promo/). Render with:
  //   helios render promo.html --width 1440 --height 1080 --fps 24 --duration 20.375
  import { Promo, FPS, FRAMES } from './src/promo/index.js';

  const ctx = document.getElementById('film').getContext('2d');
  const film = Promo.load('assets');

  window.renderAt = async (t) => {
    const f = await film;
    const frame = Math.min(FRAMES - 1, Math.max(0, Math.round(t * FPS)));
    await f.prepare(frame);
    f.render(ctx, frame);
  };
</script>
</body>
</html>
