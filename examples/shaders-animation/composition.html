<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaders Composition</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    h1 {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      color: #fff;
      font: 700 8vw/1 system-ui, sans-serif;
      opacity: 0;
    }
  </style>
</head>
<body>
  <canvas id="shader"></canvas>
  <h1 id="title">Helios × Shaders</h1>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
