<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas launch card</title>
<style>
  html, body { margin: 0; background: #05060a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Canvas page in the shape agents write: every frame is a pure function of t.
  const W = window.innerWidth, H = window.innerHeight;
  const canvas = document.getElementById('c');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  const DURATION = 5;
  window.helios = { duration: DURATION, fps: 30 };

  const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
  // Deterministic particles: a hash of the index, never Math.random at draw time.
  const rnd = (i, k) => { const s = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return s - Math.floor(s); };
  const N = 140;

  window.renderAt = (t) => {
    const u = Math.min(W, H) / 1080;
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, `hsl(${220 + 30 * Math.sin(t)}, 60%, 12%)`);
    g.addColorStop(1, `hsl(${280 + 20 * Math.cos(t * 0.7)}, 55%, 6%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < N; i++) {
      const x = (rnd(i, 1) * W + t * (20 + 60 * rnd(i, 2)) * u) % W;
      const y = (rnd(i, 3) * H + Math.sin(t * 2 + i) * 12 * u);
      const r = (1 + 3 * rnd(i, 4)) * u;
      ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.6 * rnd(i, 5)})`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    const cx = W / 2, cy = H / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.8);
    for (let k = 0; k < 6; k++) {
      ctx.rotate(Math.PI / 3);
      ctx.fillStyle = `hsla(${(k * 60 + t * 90) % 360}, 80%, 60%, 0.85)`;
      const s = 120 * u * ease(t / 1.2);
      ctx.fillRect(140 * u, -s / 2, s, s);
    }
    ctx.restore();

    ctx.strokeStyle = '#7aa2ff';
    ctx.lineWidth = 6 * u;
    ctx.beginPath();
    ctx.arc(cx, cy, 300 * u, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ease(t / DURATION));
    ctx.stroke();

    const a = ease((t - 0.6) / 0.8);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 ${Math.round(96 * u)}px system-ui, -apple-system, Helvetica, Arial, sans-serif`;
    ctx.fillText('Helios 2.0', cx, cy - 20 * u + (1 - a) * 40 * u);
    ctx.font = `400 ${Math.round(40 * u)}px system-ui, -apple-system, Helvetica, Arial, sans-serif`;
    ctx.fillText(`Frame-exact video, t = ${t.toFixed(2)} s`, cx, cy + 70 * u);
    ctx.globalAlpha = 1;
  };
  window.renderAt(0);
</script>
</body>
</html>
