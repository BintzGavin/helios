<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DOM title card with a Google Font</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 30% 20%, #23305e 0%, #0b0d17 70%);
    color: #f4f4f8; font-family: 'Inter', sans-serif;
  }
  .stage { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  h1 {
    font-family: 'Playfair Display', serif; font-size: 7.5vw; margin: 0; letter-spacing: -0.02em;
    animation: rise 1.2s cubic-bezier(.2,.8,.2,1) 0.2s both;
  }
  p.sub { font-size: 2.2vw; margin: 1.2vw 0 0; color: #b9c1e6; animation: fade 1s ease 0.9s both; }
  .bars { display: flex; gap: 1.2vw; justify-content: center; align-items: flex-end; height: 14vw; margin-top: 3vw; }
  .bar { width: 4vw; background: linear-gradient(#ffb86b, #ff5f6d); border-radius: .6vw .6vw 0 0; transform-origin: bottom; animation: grow 1.4s cubic-bezier(.3,.9,.3,1) both; }
  .bar:nth-child(1) { height: 40%; animation-delay: 1.4s; }
  .bar:nth-child(2) { height: 65%; animation-delay: 1.55s; }
  .bar:nth-child(3) { height: 50%; animation-delay: 1.7s; }
  .bar:nth-child(4) { height: 85%; animation-delay: 1.85s; }
  .bar:nth-child(5) { height: 100%; animation-delay: 2s; }
  .ring { position: absolute; right: 6vw; top: 6vw; width: 9vw; height: 9vw; border-radius: 50%;
    border: .8vw solid #7aa2ff; border-top-color: transparent; animation: spin 2s linear infinite; }
  .counter { position: absolute; left: 6vw; bottom: 5vw; font-weight: 600; font-size: 2.6vw; font-variant-numeric: tabular-nums; }
  @keyframes rise { from { opacity: 0; transform: translateY(4vw); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="stage">
    <h1>Quarterly Review</h1>
    <p class="sub">Revenue grew in every region</p>
    <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
  </div>
  <div class="ring"></div>
  <div class="counter" id="counter">$0.0M</div>
<script>
  window.helios = { duration: 5, fps: 30 };
  const counter = document.getElementById('counter');
  window.renderAt = (t) => {
    const k = Math.min(Math.max((t - 1.4) / 2.5, 0), 1);
    counter.textContent = '$' + (48.2 * (1 - Math.pow(1 - k, 3))).toFixed(1) + 'M';
  };
</script>
</body>
</html>
