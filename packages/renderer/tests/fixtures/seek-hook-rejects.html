<!doctype html>
<html>
<head><style>html,body{margin:0;background:#000;width:320px;height:180px;overflow:hidden}</style></head>
<body>
<div id="box" style="width:20px;height:20px;background:#fff"></div>
<script>
// An async seek(t) whose promise rejects: the render must fail with this error.
window.seek = async (t) => {
  await Promise.resolve();
  if (t >= 0.5) throw new Error('async boom at ' + t);
};
</script>
</body>
</html>
