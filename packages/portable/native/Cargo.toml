[package]
name = "helios-gpu"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
skia-safe = { version = "=0.91.0", features = ["metal", "svg", "textlayout", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rustybuzz = "0.20"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
